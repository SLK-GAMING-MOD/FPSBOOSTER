# đặt tại FpsMaster/.github/workflows/build.yml
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v3

      - name: Cài gradle hệ thống
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Tạo gradle wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Đóng gói file APK để tải về
        uses: actions/upload-artifact@v4
        with:
          name: fps-master-apk
          path: app/build/outputs/apk/debug/*.apk
